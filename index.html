<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Foco Bloqueio — Access paused</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #0b1120;
      --surface: #152238;
      --border: #2b405a;
      --text: #f4f7fb;
      --muted: #aabbd0;
      --accent: #80e0b0;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --background: #f2f6fa;
      --surface: #ffffff;
      --border: #d4e0e8;
      --text: #152439;
      --muted: #4c6075;
      --accent: #18754c;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 32px 20px;
      background: var(--background);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main { width: min(100%, 500px); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .05em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    h1 {
      margin: 24px 0 14px;
      font-size: clamp(32px, 8vw, 43px);
      line-height: 1.15;
      letter-spacing: -.03em;
    }

    p { margin: 0; color: var(--muted); }

    [data-field] {
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .card {
      margin-top: 30px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
    }

    .label {
      margin-bottom: 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .goal {
      color: var(--text);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.45;
    }

    .action { margin-top: 16px; font-size: 14px; }
    .schedule { margin-top: 28px; }
    .unlock { color: var(--text); font-size: 27px; font-weight: 750; }
    footer { margin-top: 30px; color: var(--muted); font-size: 13px; }

    @media (max-width: 400px) {
      .card { padding: 20px; }
      .goal { font-size: 18px; }
      .unlock { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">
      <span class="dot" aria-hidden="true"></span>
      <span>ACCESS PAUSED · <span data-field="site">Blocked website</span></span>
    </div>

    <h1 data-field="title">You chose to protect your time.</h1>
    <p data-field="message">Entertainment can wait. Focus on what matters.</p>

    <section class="card" aria-labelledby="goal-label">
      <div class="label" id="goal-label">Your goal</div>
      <p class="goal" data-field="goal">Build something meaningful to you.</p>
      <p class="action" data-field="action">Start with one small task.</p>
    </section>

    <section class="schedule" aria-labelledby="unlock-label">
      <div class="label" id="unlock-label">Next unlock</div>
      <div class="unlock" data-field="unlock">Check your schedule</div>
    </section>

    <footer data-field="footer">Discipline today. Freedom tomorrow.</footer>
  </main>

  <script>
    (() => {
      'use strict';

      // English-only parameters, passed in the URL fragment (#).
      const params = new URLSearchParams(location.hash.slice(1));

      document.documentElement.dataset.theme =
        params.get('theme') === 'light' ? 'light' : 'dark';

      // Each data-field attribute matches its URL parameter name.
      for (const element of document.querySelectorAll('[data-field]')) {
        const value = params.get(element.dataset.field);
        if (value !== null) element.textContent = value.slice(0, 600);
      }

      const site = params.get('site');
      if (site) document.title = `Access paused — ${site.slice(0, 100)}`;
    })();
  </script>
</body>
</html>
